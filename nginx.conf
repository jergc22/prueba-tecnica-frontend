server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta del cliente (/product/:id) sirve index.html y la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los ficheros de assets llevan hash en el nombre: se pueden cachear sin caducidad.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
